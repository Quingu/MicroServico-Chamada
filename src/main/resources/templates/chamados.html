<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Chamados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>
        <div class="container mt-4" th:fragment="content">
            <h2 class="mb-4">Lista de Chamados</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Descrição</th>
                        <th>Situação</th>
                        <th>Solicitante</th>
                        <th>Abertura</th>
                    </tr>
                </thead>
                <tbody>
                <th:block th:each="chamado : ${chamados}">
                    <tr>
                        <td th:text="${chamado?.titulo}"></td>
                        <td th:text="${chamado?.descricao}"></td>
                        <td th:text="${chamado?.situacao}"></td>
                        <td th:text="${chamado?.nomeSolicitante}"></td>
                        <td th:text="${chamado?.dataAbertura}"></td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
